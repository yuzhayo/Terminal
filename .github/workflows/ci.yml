name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.304

      - name: Restore native dependencies
        shell: pwsh
        run: ./tools/Restore-Dependencies.ps1

      - uses: microsoft/setup-msbuild@v3

      - name: Verify pinned toolchain
        shell: pwsh
        run: ./tools/Test-Toolchain.ps1

      - name: Build Debug
        shell: pwsh
        run: ./tools/Build.ps1 -Configuration Debug

      - name: Run Debug tests
        shell: pwsh
        run: ./build/x64/Debug/TerminalTests.exe

      - name: Build Release
        shell: pwsh
        run: ./tools/Build.ps1 -Configuration Release

      - name: Run Release tests
        shell: pwsh
        run: ./build/x64/Release/TerminalTests.exe

      - name: Test installed preview update
        shell: pwsh
        run: ./tools/Test-InstalledUpdate.ps1 -Environment CurrentUser -AllowInstallMutation
